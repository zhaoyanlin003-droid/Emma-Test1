<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Launch Checklist</title>
<style>
  :root {
    --bg: #f5f6f3;
    --card: #ffffff;
    --ink: #1b2333;
    --muted: #6b7689;
    --line: #e3e8f0;
    --accent: #176b58;
    --done: #176b58;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: #173d34;
    color: #fff;
    padding: 40px max(24px, calc((100vw - 1120px) / 2));
  }
  header h1 { margin: 12px 0 10px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -1px; }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  .wrap { max-width: 1168px; margin: 0 auto; padding: 24px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #b8d9c9; }
  .intro { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 10px 0 22px; }
  .intro h2 { margin: 0 0 5px; font-size: 21px; }
  .intro p { margin: 0; font-size: 14px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  #notice { color: #b42318; font-size: 14px; }
  :focus-visible { outline: 3px solid #79bbaa; outline-offset: 3px; }
  .bar {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .track { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--done); transition: width .25s ease; }
  .bar strong { font-size: 14px; white-space: nowrap; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 7px 12px;
    color: var(--ink);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 0;
  }
  section h2 { margin: 0 0 4px; font-size: 17px; }
  section .hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--line);
  }
  li:first-child { border-top: none; }
  li input[type="checkbox"] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--done); cursor: pointer; }
  li label { flex: 1; cursor: pointer; font-size: 14px; line-height: 1.45; }
  li.done label { text-decoration: line-through; color: var(--muted); }
  .owner {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
    font-size: 13px;
    width: 120px;
    color: var(--ink);
  }
  .owner::placeholder { color: #a7b0c0; }
  .count { font-size: 12px; color: var(--muted); font-weight: 600; }
  .count { background: #edf3ef; padding: 4px 9px; border-radius: 20px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 0 16px; }
  @media (max-width: 760px) {
    #sections { grid-template-columns: 1fr; }
    .intro { align-items: flex-start; flex-direction: column; }
    .wrap { padding: 16px; }
    .owner { width: 90px; }
  }
  @media print {
    header { background: none; color: var(--ink); padding: 0; }
    .actions, footer { display: none; }
    section { break-inside: avoid; }
    body { background: white; }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">TEAM WORKSPACE / LAUNCH PLAYBOOK</div>
  <h1>Team Launch Checklist</h1>
  <p>A clear plan. A confident team. A launch with nothing left behind.</p>
</header>

<div class="wrap">
  <div class="intro">
    <div>
      <h2>Your path to launch</h2>
      <p>Assign owners, check off tasks, and keep every phase on track.</p>
    </div>
    <div class="actions">
      <button id="export" type="button">Export checklist</button>
      <button id="print" type="button">Print / PDF</button>
      <button id="reset" type="button">Reset all</button>
    </div>
  </div>
  <p id="notice" role="alert" hidden></p>
  <div class="bar">
    <strong id="summary" aria-live="polite">0 of 24 done</strong>
    <div class="track" role="progressbar" aria-label="Launch readiness" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"><div class="fill" id="fill"></div></div>
  </div>

  <div id="sections"></div>

  <footer>Data is stored locally in this browser only — nothing is uploaded.</footer>
</div>

<script>
const SECTIONS = [
  {
    id: "planning",
    title: "1. Planning",
    hint: "Lock scope, dates, and owners before anything else moves.",
    items: [
      "Define launch goal and success metrics",
      "Confirm launch date and freeze deadline",
      "Name a launch owner and backup owner",
      "List target audiences and channels",
      "Build the milestone timeline and share it",
      "Identify risks and write the rollback plan"
    ]
  },
  {
    id: "content",
    title: "2. Content",
    hint: "Everything customers and internal teams will read or see.",
    items: [
      "Draft core messaging and positioning",
      "Write announcement blog post or release notes",
      "Prepare social posts and email copy",
      "Produce screenshots, demo video, or graphics",
      "Update product docs and help center articles",
      "Localize or proofread final copy"
    ]
  },
  {
    id: "approvals",
    title: "3. Approvals",
    hint: "Sign-offs needed before the launch can be scheduled.",
    items: [
      "Product sign-off on scope and demo",
      "Legal and compliance review complete",
      "Brand and design review complete",
      "Security or privacy review complete",
      "Leadership go/no-go decision recorded",
      "Support and sales enablement briefed"
    ]
  },
  {
    id: "launch-day",
    title: "4. Launch Day",
    hint: "The run-of-show for the day itself.",
    items: [
      "Final pre-launch smoke test in production",
      "Feature flag or release toggled on",
      "Publish announcement and social posts",
      "Send customer and internal emails",
      "Monitor dashboards, errors, and support queue",
      "Post-launch recap and next-step owners assigned"
    ]
  }
];

const KEY = "team-launch-checklist-v1";
const state = load();

function reportError(message, error) {
  console.error(message, error);
  const notice = document.getElementById("notice");
  notice.textContent = message;
  notice.hidden = false;
}

function validState(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value) &&
    Object.values(value).every(entry => entry !== null && typeof entry === "object" &&
      typeof entry.done === "boolean" && typeof entry.owner === "string");
}

function load() {
  try {
    const stored = localStorage.getItem(KEY);
    if (stored === null) return {};
    const value = JSON.parse(stored);
    if (!validState(value)) throw new Error("Invalid saved checklist");
    return value;
  } catch (error) {
    reportError("Saved progress could not be loaded. You can still use and export this checklist.", error);
    return {};
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    document.getElementById("notice").hidden = true;
  } catch (error) {
    reportError("Progress could not be saved in this browser. Export your checklist before closing.", error);
  }
}

function render() {
  const host = document.getElementById("sections");
  host.innerHTML = "";

  SECTIONS.forEach(section => {
    const el = document.createElement("section");
    const list = document.createElement("ul");

    section.items.forEach((text, i) => {
      const key = section.id + ":" + i;
      const entry = state[key] || { done: false, owner: "" };
      const li = document.createElement("li");
      if (entry.done) li.className = "done";

      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = entry.done;
      box.id = key;
      box.addEventListener("change", () => {
        state[key] = { done: box.checked, owner: owner.value };
        save();
        li.classList.toggle("done", box.checked);
        updateProgress();
      });

      const label = document.createElement("label");
      label.textContent = text;
      label.htmlFor = key;

      const owner = document.createElement("input");
      owner.type = "text";
      owner.className = "owner";
      owner.placeholder = "Owner";
      owner.setAttribute("aria-label", "Owner for " + text);
      owner.value = entry.owner;
      owner.addEventListener("input", () => {
        state[key] = { ...state[key], done: box.checked, owner: owner.value };
        save();
      });

      li.append(box, label, owner);
      list.append(li);
    });

    const done = section.items.filter((_, i) => (state[section.id + ":" + i] || {}).done).length;

    const head = document.createElement("div");
    head.className = "head";
    const h2 = document.createElement("h2");
    h2.textContent = section.title;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = done + " / " + section.items.length;
    head.append(h2, count);

    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = section.hint;

    el.append(head, hint, list);
    host.append(el);
  });

  updateProgress();
}

function updateProgress() {
  let total = 0;
  let done = 0;
  SECTIONS.forEach((section, index) => {
    const completed = section.items.filter((_, i) => state[section.id + ":" + i]?.done).length;
    total += section.items.length;
    done += completed;
    document.querySelectorAll(".count")[index].textContent = completed + " / " + section.items.length;
  });
  document.getElementById("summary").textContent = done + " of " + total + " done";
  document.getElementById("fill").style.width = total ? (done / total * 100) + "%" : "0%";
  document.querySelector(".track").setAttribute("aria-valuemax", total);
  document.querySelector(".track").setAttribute("aria-valuenow", done);
}

document.getElementById("export").addEventListener("click", () => {
  const checklist = SECTIONS.map(section => ({
    section: section.title,
    tasks: section.items.map((task, i) => ({
      task,
      done: state[section.id + ":" + i]?.done || false,
      owner: state[section.id + ":" + i]?.owner || ""
    }))
  }));
  const url = URL.createObjectURL(new Blob([JSON.stringify(checklist, null, 2)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "team-launch-checklist.json";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

document.getElementById("print").addEventListener("click", () => window.print());

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Clear all checkmarks and owners?")) return;
  Object.keys(state).forEach(k => delete state[k]);
  save();
  render();
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Launch Checklist</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #243049;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --border: #334155;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 28px 20px 20px;
      max-width: 880px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 6px; font-size: 1.8rem; }
    .subtitle { color: var(--muted); margin: 0; }
    .progress-wrap {
      max-width: 880px;
      margin: 16px auto 0;
      padding: 0 20px;
    }
    .progress-bar {
      height: 10px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .3s ease;
    }
    .progress-label { color: var(--muted); font-size: .9rem; margin-top: 6px; }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 18px;
    }
    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--panel-2);
    }
    .section-head h2 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: .8rem;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 10px;
      border-radius: 999px;
    }
    ul.items { list-style: none; margin: 0; padding: 8px 8px 12px; }
    li.item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
    }
    li.item:hover { background: var(--panel-2); }
    li.item input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--accent-2); cursor: pointer; flex: none;
    }
    li.item label { flex: 1; cursor: pointer; }
    li.item.done label { text-decoration: line-through; color: var(--muted); }
    .del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 1.1rem; padding: 2px 6px; border-radius: 6px; line-height: 1;
    }
    .del:hover { color: var(--danger); background: var(--bg); }
    .add-row { display: flex; gap: 8px; padding: 4px 12px 12px; }
    .add-row input {
      flex: 1; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    .add-row button, .toolbar button {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .9rem;
    }
    .add-row button:hover, .toolbar button:hover { border-color: var(--accent); }
    .toolbar {
      max-width: 880px; margin: 0 auto; padding: 0 20px 40px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 20px 30px; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 Team Launch Checklist</h1>
    <p class="subtitle">Track your launch from first plan to go-live. Progress saves automatically in this browser.</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 of 0 complete</div>
  </div>

  <main id="board"></main>

  <div class="toolbar">
    <button id="resetBtn">Reset all</button>
    <button id="exportBtn">Export JSON</button>
  </div>

  <footer>Single-file app · no server or build required · data stored locally via localStorage</footer>

  <script>
    const STORAGE_KEY = "team-launch-checklist-v1";

    const DEFAULTS = [
      {
        id: "planning",
        title: "Planning",
        icon: "🗺️",
        items: [
          "Define launch goals and success metrics",
          "Set the target launch date",
          "Identify owners for each workstream",
          "Draft the launch timeline and milestones",
          "List risks and mitigation plans"
        ]
      },
      {
        id: "content",
        title: "Content",
        icon: "✍️",
        items: [
          "Write announcement blog post",
          "Prepare social media copy and assets",
          "Update website / landing page",
          "Create product documentation",
          "Prepare email newsletter"
        ]
      },
      {
        id: "approvals",
        title: "Approvals",
        icon: "✅",
        items: [
          "Legal review of public messaging",
          "Brand and design sign-off",
          "Engineering readiness review",
          "Leadership go / no-go approval",
          "Support team briefed and ready"
        ]
      },
      {
        id: "launch",
        title: "Launch day",
        icon: "🎉",
        items: [
          "Deploy / enable the release",
          "Publish announcement and social posts",
          "Send newsletter",
          "Monitor dashboards and error rates",
          "Share results and thank the team"
        ]
      }
    ];

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.sections)) return saved;
      } catch (e) {}
      return {
        sections: DEFAULTS.map(s => ({
          id: s.id, title: s.title, icon: s.icon,
          items: s.items.map((text, i) => ({ id: s.id + "-" + i, text, done: false }))
        }))
      };
    }

    let state = load();

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function uid() { return "i-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7); }

    function render() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      let total = 0, done = 0;

      state.sections.forEach(section => {
        const doneCount = section.items.filter(i => i.done).length;
        total += section.items.length;
        done += doneCount;

        const sec = document.createElement("section");
        sec.className = "section";

        const head = document.createElement("div");
        head.className = "section-head";
        head.innerHTML =
          '<h2><span>' + section.icon + '</span>' + section.title + '</h2>' +
          '<span class="badge">' + doneCount + ' / ' + section.items.length + '</span>';
        sec.appendChild(head);

        const ul = document.createElement("ul");
        ul.className = "items";

        section.items.forEach(item => {
          const li = document.createElement("li");
          li.className = "item" + (item.done ? " done" : "");

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = item.done;
          cb.onchange = () => { item.done = cb.checked; save(); render(); };

          const label = document.createElement("label");
          label.textContent = item.text;
          label.onclick = () => { item.done = !item.done; save(); render(); };

          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "×";
          del.title = "Remove task";
          del.onclick = () => {
            section.items = section.items.filter(i => i.id !== item.id);
            save(); render();
          };

          li.append(cb, label, del);
          ul.appendChild(li);
        });
        sec.appendChild(ul);

        const addRow = document.createElement("div");
        addRow.className = "add-row";
        const input = document.createElement("input");
        input.placeholder = "Add a task to " + section.title + "…";
        const addBtn = document.createElement("button");
        addBtn.textContent = "Add";
        const add = () => {
          const text = input.value.trim();
          if (!text) return;
          section.items.push({ id: uid(), text, done: false });
          input.value = "";
          save(); render();
        };
        addBtn.onclick = add;
        input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
        addRow.append(input, addBtn);
        sec.appendChild(addRow);

        board.appendChild(sec);
      });

      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("progressLabel").textContent =
        done + " of " + total + " complete (" + pct + "%)";
    }

    document.getElementById("resetBtn").onclick = () => {
      if (confirm("Reset the checklist to defaults? This clears your saved progress.")) {
        localStorage.removeItem(STORAGE_KEY);
        state = load();
        save(); render();
      }
    };

    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "team-launch-checklist.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    render();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Request Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <h1>Feature Request Dashboard</h1>
    <p class="subtitle">Disposable Code Tab QA repo fixture</p>

    <div class="filters">
      <div class="filter">
        <label for="priorityFilter">Priority</label>
        <select id="priorityFilter">
          <option value="all">All</option>
        </select>
      </div>

      <div class="filter">
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="all">All</option>
        </select>
      </div>

      <div class="filter">
        <button type="button" id="resetFilters" disabled>Reset filters</button>
      </div>
    </div>

    <div id="activeFilters" class="active-filters" aria-live="polite"></div>

    <p id="resultCount" class="meta" aria-live="polite"></p>
    <p id="dataSource" class="meta data-source"></p>

    <section id="cards" class="cards" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
